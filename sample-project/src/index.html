<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Smart Plate</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 min-h-screen">

  <div class="max-w-lg mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-green-700">The Smart Plate</h1>
      <!-- Dark Mode Toggle (US.6) -->
      <button id="dark-toggle" class="text-sm px-3 py-1 rounded-lg border border-gray-300 text-gray-600 hover:bg-gray-100 transition">
        Dark Mode
      </button>
    </div>

    <!-- Save Recipe Form (US.1) -->
    <form id="recipe-form" class="bg-white rounded-xl shadow p-5 mb-8" novalidate>
      <h2 class="text-lg font-semibold mb-4 text-gray-700">Add Recipe</h2>

      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-600 mb-1" for="title">Title *</label>
        <input
          id="title"
          type="text"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400"
          placeholder="e.g. Spaghetti Bolognese"
        />
        <p id="title-error" class="text-red-500 text-xs mt-1 hidden">Title is required</p>
      </div>

      <div class="mb-3">
        <label class="block text-sm font-medium text-gray-600 mb-1" for="ingredients">Ingredients</label>
        <textarea
          id="ingredients"
          rows="3"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400"
          placeholder="e.g. 200g pasta, 1 onion..."
        ></textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-600 mb-1" for="instructions">Instructions</label>
        <textarea
          id="instructions"
          rows="4"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-green-400"
          placeholder="e.g. Boil pasta, fry onion..."
        ></textarea>
      </div>

      <button
        type="submit"
        class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg text-sm transition"
      >
        Save Recipe
      </button>
    </form>

    <!-- Recipe List (US.2, US.3) -->
    <section>
      <div class="flex items-center justify-between mb-3">
        <h2 class="text-lg font-semibold text-gray-700">My Recipes</h2>
      </div>
      <!-- Search (US.4) -->
      <input
        id="search"
        type="text"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm mb-4 focus:outline-none focus:ring-2 focus:ring-green-400"
        placeholder="Search recipes..."
      />
      <div id="recipe-list"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
